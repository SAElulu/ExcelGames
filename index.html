<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Détente.xlsx</title>
  <meta name="description" content="Un classeur de mini casse-têtes relaxants, à jouer seul ou entre amis.">
  <meta name="theme-color" content="#217346">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23217346'/%3E%3Cpath d='M8 8h16v16H8z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M8 13.3h16M8 18.6h16M13.3 8v16M18.6 8v16' stroke='%23fff' stroke-width='1.2' opacity='.8'/%3E%3C/svg%3E">
  <style>
/* =========================================================
   Détente.xlsx — habillage « tableur »
   ========================================================= */
:root {
  --accent: #217346; --accent-d: #185c37; --accent-l: #e6f2ea; --accent-ll: #f1f8f3;
  --bg: #ffffff; --chrome: #f3f2f1; --chrome-2: #faf9f8; --line: #e1dfdd; --grid: #e2e2e2;
  --head: #f3f3f3; --head-sel: #d3d3d3; --text: #252423; --muted: #605e5c; --soft: #8a8886;
  --note: #fff8c5; --danger: #c42b1c; --ok: #107c41; --shadow: 0 6px 24px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);
  --cw: 64px; --rh: 22px; --hw: 42px; --cs: 46px;
  --font: "Segoe UI", "Aptos", Calibri, system-ui, -apple-system, Roboto, Arial, sans-serif;
  --cell-font: Calibri, "Aptos", "Carlito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-accent="bleu"] { --accent: #2b579a; --accent-d: #1e3f73; --accent-l: #e5edf8; --accent-ll: #f2f6fc; }
:root[data-accent="violet"] { --accent: #7b3fa0; --accent-d: #5b2d78; --accent-l: #f1e8f7; --accent-ll: #f8f3fb; }
:root[data-accent="corail"] { --accent: #c4502a; --accent-d: #973c1e; --accent-l: #fbe9e2; --accent-ll: #fdf4f0; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1f1f; --chrome: #292929; --chrome-2: #2f2f2f; --line: #3d3d3d; --grid: #333;
    --head: #2b2b2b; --head-sel: #474747; --text: #f0f0f0; --muted: #c8c6c4; --soft: #9a9896;
    --note: #4a4426; --accent-l: #1f3a2b; --accent-ll: #1b2a21; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1f1f; --chrome: #292929; --chrome-2: #2f2f2f; --line: #3d3d3d; --grid: #333;
  --head: #2b2b2b; --head-sel: #474747; --text: #f0f0f0; --muted: #c8c6c4; --soft: #9a9896;
  --note: #4a4426; --accent-l: #1f3a2b; --accent-ll: #1b2a21; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.35 var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }

#app { display: grid; grid-template-rows: auto auto auto auto 1fr auto auto; grid-template-columns: minmax(0, 1fr); height: 100dvh; width: 100%; overflow: hidden; }
#app > * { min-width: 0; }

/* ---------- Barre de titre ---------- */
.titlebar { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; background: var(--accent); color: #fff; user-select: none; }
.titlebar .logo { width: 22px; height: 22px; border-radius: 4px; background: #fff; color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 13px; box-shadow: inset -6px 0 0 rgba(0,0,0,.08); }
.qat { display: flex; gap: 2px; }
.qat button { background: none; border: 0; color: #fff; width: 28px; height: 28px; border-radius: 4px; font-size: 15px; opacity: .92; }
.qat button:hover { background: rgba(255,255,255,.16); }
.titlebar .doc { flex: 1; text-align: center; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .doc .saved { opacity: .75; font-size: 12px; margin-left: 6px; transition: opacity .3s; }
.search { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.18); border-radius: 4px; padding: 0 8px; height: 26px; width: min(300px, 28vw); position: relative; }
.search input { background: none; border: 0; outline: 0; color: #fff; width: 100%; font-size: 12.5px; }
.search input::placeholder { color: rgba(255,255,255,.78); }
.search .results { position: absolute; top: 30px; left: 0; right: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); z-index: 60; padding: 4px; display: none; }
.search .results.open { display: block; }
.search .results button { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 4px; }
.search .results button:hover, .search .results button.sel { background: var(--accent-l); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: #fff; border: 2px solid rgba(255,255,255,.85); cursor: pointer; background: #555; flex: none; }
.who { display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 4px; padding: 2px 6px; background: none; border: 0; color: #fff; }
.who:hover { background: rgba(255,255,255,.14); }

/* ---------- Ruban ---------- */
.ribbon-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: var(--chrome); border-bottom: 1px solid var(--line); height: 34px; overflow-x: auto; scrollbar-width: none; }
.ribbon-tabs::-webkit-scrollbar { display: none; }
.rtab { background: none; border: 0; padding: 7px 12px 8px; position: relative; color: var(--text); white-space: nowrap; border-radius: 4px 4px 0 0; }
.rtab:hover { background: rgba(0,0,0,.05); }
.rtab.active { color: var(--accent); font-weight: 600; }
.rtab.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px; background: var(--accent); animation: grow .25s ease; }
.rtab.file { background: var(--accent); color: #fff; margin-right: 6px; border-radius: 4px; padding: 5px 14px; margin-bottom: 4px; }
.rtab.file:hover { background: var(--accent-d); }
.ribbon-tabs .spacer { flex: 1; }
.rtab.small { font-size: 12px; color: var(--muted); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.ribbon { background: var(--chrome-2); border-bottom: 1px solid var(--line); height: 96px; overflow: hidden; transition: height .25s ease; }
.ribbon.collapsed { height: 0; border-bottom: 0; }
.rpanel { display: none; height: 96px; padding: 4px 6px 0; gap: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.rpanel.active { display: flex; animation: fadeUp .22s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.rgroup { display: flex; flex-direction: column; padding: 0 8px; border-right: 1px solid var(--line); flex: none; }
.rgroup .items { display: flex; gap: 2px; flex: 1; align-items: flex-start; }
.rgroup .label { text-align: center; font-size: 11px; color: var(--soft); padding: 2px 0 4px; white-space: nowrap; }
.rbtn { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; background: none; border: 1px solid transparent; border-radius: 4px; padding: 4px 6px; min-width: 52px; max-width: 86px; font-size: 11.5px; line-height: 1.15; text-align: center; height: 70px; }
.rbtn .ic { font-size: 24px; line-height: 30px; height: 30px; display: grid; place-items: center; }
.rbtn:hover { background: var(--accent-l); border-color: rgba(0,0,0,.06); }
.rbtn:active { transform: translateY(1px); }
.rbtn.on { background: var(--accent-l); border-color: var(--accent); }
.rbtn:disabled { opacity: .4; cursor: default; }
.rstack { display: flex; flex-direction: column; gap: 1px; }
.rsm { display: flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent; border-radius: 3px; padding: 2px 6px; font-size: 12px; height: 22px; white-space: nowrap; }
.rsm:hover { background: var(--accent-l); }
.rsm.on { background: var(--accent-l); border-color: var(--accent); }
.rsm .ic { width: 16px; text-align: center; }
.collapse-btn { margin-left: auto; align-self: flex-end; margin-bottom: 4px; background: none; border: 0; color: var(--soft); width: 26px; height: 22px; border-radius: 4px; }
.collapse-btn:hover { background: rgba(0,0,0,.06); }
.swatches { display: grid; grid-template-columns: repeat(2, 22px); gap: 4px; padding-top: 4px; }
.swatches button { width: 22px; height: 22px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
.swatches button.on { outline: 2px solid var(--text); outline-offset: 1px; }

/* ---------- Barre de formule ---------- */
.formulabar { display: flex; align-items: center; gap: 0; height: 30px; background: var(--bg); border-bottom: 1px solid var(--line); padding: 0 6px; }
.namebox { width: 92px; height: 22px; border: 1px solid var(--line); padding: 0 6px; font-size: 12.5px; background: var(--bg); display: flex; align-items: center; justify-content: space-between; font-family: var(--cell-font); }
.namebox::after { content: "⌄"; color: var(--soft); font-size: 11px; margin-top: -4px; }
.fxbtns { display: flex; align-items: center; gap: 10px; padding: 0 10px; color: var(--soft); border-right: 1px solid var(--line); margin-right: 8px; height: 100%; }
.fxbtns b { font-style: italic; font-family: Georgia, serif; color: var(--muted); font-weight: 400; }
.fxtext { flex: 1; font-family: var(--cell-font); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.fxtext .typing { border-right: 1.5px solid var(--accent); animation: caret 1s steps(1) infinite; padding-right: 1px; }
@keyframes caret { 50% { border-color: transparent; } }

/* ---------- Zone de feuille ---------- */
.sheet-wrap { position: relative; display: grid; grid-template-columns: var(--hw) 1fr; grid-template-rows: var(--rh) 1fr; overflow: hidden; background: var(--bg); min-height: 0; }
.corner { background: var(--head); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
.corner::after { content: ""; position: absolute; right: 3px; bottom: 3px; border: 5px solid transparent; border-right-color: var(--soft); border-bottom-color: var(--soft); opacity: .6; }
.colhead, .rowhead { position: relative; overflow: hidden; background: var(--head); user-select: none; }
.colhead { border-bottom: 1px solid var(--line); }
.rowhead { border-right: 1px solid var(--line); }
.colhead .inner, .rowhead .inner { position: absolute; left: 0; top: 0; will-change: transform; }
.colhead .inner { display: flex; }
.colhead .h { width: var(--cw); height: var(--rh); border-right: 1px solid var(--line); text-align: center; line-height: var(--rh); color: var(--muted); font-size: 12px; flex: none; }
.rowhead .h { height: var(--rh); width: var(--hw); border-bottom: 1px solid var(--line); text-align: center; line-height: var(--rh); color: var(--muted); font-size: 11.5px; }
.hl { position: absolute; background: var(--head-sel); pointer-events: none; transition: transform .08s ease-out, width .08s, height .08s; mix-blend-mode: multiply; }
:root[data-theme="dark"] .hl { mix-blend-mode: screen; opacity: .5; }
.colhead .hl { top: 0; height: 100%; border-bottom: 2px solid var(--accent); }
.rowhead .hl { left: 0; width: 100%; border-right: 2px solid var(--accent); }

.scroll { position: relative; overflow: auto; overscroll-behavior: contain; }
.canvas { position: relative; min-width: 100%; min-height: 100%; background-color: var(--bg);
  background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: var(--cw) var(--rh); background-position: -1px -1px; }
body.nogrid .canvas { background-image: none; }
.selbox { position: absolute; width: var(--cw); height: var(--rh); border: 2px solid var(--accent); pointer-events: none; z-index: 5; transition: transform .14s cubic-bezier(.2,.8,.2,1), width .14s, height .14s; left: 0; top: 0; }
.selbox::after { content: ""; position: absolute; right: -4px; bottom: -4px; width: 6px; height: 6px; background: var(--accent); border: 1px solid var(--bg); }
.selbox.hidden { opacity: 0; }
.usercell { position: absolute; height: var(--rh); line-height: var(--rh); padding: 0 4px; font-family: var(--cell-font); font-size: 13.5px; white-space: nowrap; pointer-events: none; z-index: 2; }
.usercell.num { text-align: right; }
.cell-editor { position: absolute; height: var(--rh); border: 2px solid var(--accent); padding: 0 3px; font-family: var(--cell-font); font-size: 13.5px; background: var(--bg); outline: 0; z-index: 8; min-width: var(--cw); }

/* feuilles */
.sheet { position: absolute; left: 0; top: 0; min-width: 100%; padding: calc(var(--rh)) 0 80px calc(var(--cw)); display: none; }
.sheet.active { display: block; }
.sheet.enter-r { animation: enterR .42s cubic-bezier(.2,.8,.2,1); }
.sheet.enter-l { animation: enterL .42s cubic-bezier(.2,.8,.2,1); }
.sheet.leave-l { display: block; animation: leaveL .32s ease forwards; pointer-events: none; }
.sheet.leave-r { display: block; animation: leaveR .32s ease forwards; pointer-events: none; }
@keyframes enterR { from { opacity: 0; transform: translateX(70px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes enterL { from { opacity: 0; transform: translateX(-70px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes leaveL { to { opacity: 0; transform: translateX(-60px); } }
@keyframes leaveR { to { opacity: 0; transform: translateX(60px); } }
body.noanim *, body.noanim *::before, body.noanim *::after { animation-duration: 0s !important; transition-duration: 0s !important; }

/* rideau de calcul lors des changements de feuille */
.calc-sweep { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.calc-sweep i { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--rh); background: var(--accent); opacity: 0; animation: blip .5s ease forwards; }
@keyframes blip { 0% { opacity: 0; } 30% { opacity: .22; } 100% { opacity: 0; } }

/* titres façon cellules fusionnées */
.s-title { display: flex; align-items: center; gap: 14px; height: calc(var(--rh) * 3); padding-left: 6px; }
.s-title .big { font-size: 26px; font-weight: 300; letter-spacing: -.2px; font-family: var(--font); }
.s-title .big b { font-weight: 700; color: var(--accent); }
.s-title .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; background: var(--bg); }
.s-sub { height: var(--rh); line-height: var(--rh); color: var(--muted); padding-left: 6px; font-family: var(--cell-font); font-size: 13.5px; margin-bottom: var(--rh); }
.s-sub .tick { color: var(--ok); font-weight: 700; }
.sec-h { display: flex; align-items: center; gap: 8px; height: var(--rh); font-weight: 700; font-family: var(--cell-font); font-size: 14px; padding-left: 6px; margin: var(--rh) 0 0; color: var(--text); }
.sec-h .rule { flex: 1; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); max-width: 380px; opacity: .6; }

/* ---------- Tableau Excel stylé ---------- */
.xtable { border-collapse: collapse; font-family: var(--cell-font); font-size: 13.5px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
.xtable th { background: var(--accent); color: #fff; font-weight: 700; text-align: left; height: var(--rh); padding: 0 10px; white-space: nowrap; position: relative; }
.xtable th.filter { padding-right: 24px; white-space: nowrap; position: relative; }
.xtable th.filter::after { content: "▾"; position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; font-size: 9px; line-height: 14px; text-align: center; background: rgba(255,255,255,.9); color: #444; border-radius: 2px; }
.xtable td { height: calc(var(--rh) * 2); padding: 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.xtable.compact td { height: var(--rh); }
.xtable tbody tr:nth-child(odd) td { background: var(--accent-ll); }
.xtable tbody tr.link { cursor: pointer; transition: background .15s; }
.xtable tbody tr.link:hover td { background: var(--accent-l); }
.xtable td.num, .xtable th.num { text-align: right; font-variant-numeric: tabular-nums; }
.xtable td.c, .xtable th.c { text-align: center; }
.xtable tfoot td { font-weight: 700; border-top: 2px solid var(--accent); height: var(--rh); background: var(--bg); }
.gname { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.gicon { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 16px; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.fx-mono { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12px; color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.done { background: #c6efce; color: #006100; }
.pill.todo { background: #ffeb9c; color: #9c5700; }
.pill.none { background: var(--head); color: var(--soft); }
.go { background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 4px 12px; font-weight: 600; }
.go:hover { background: var(--accent-d); }
.who-mini { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700; flex: none; }

/* données : barres (mise en forme conditionnelle) */
.databar { position: relative; height: 16px; min-width: 120px; background: transparent; }
.databar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1px; background: linear-gradient(90deg, #63be7b, #c6efce); border: 1px solid #63be7b; transform-origin: left; animation: barIn .8s cubic-bezier(.2,.8,.2,1) both; }
.databar span { position: relative; padding-left: 6px; font-size: 12.5px; line-height: 16px; }
@keyframes barIn { from { transform: scaleX(0); } }

/* KPI tuiles */
.kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 6px 6px; }
.kpi { width: calc(var(--cw) * 2.5); min-height: calc(var(--rh) * 3); border: 1px solid var(--line); background: var(--bg); padding: 6px 10px; border-left: 4px solid var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.kpi .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.kpi .v { font-size: 22px; font-weight: 700; font-family: var(--cell-font); }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 400; }

/* note (commentaire) */
.note { position: relative; background: var(--note); border: 1px solid #d9c96a; padding: 10px 12px 10px 14px; box-shadow: 2px 3px 8px rgba(0,0,0,.12); font-size: 13px; max-width: 340px; }
.note::before { content: ""; position: absolute; left: -1px; top: -1px; border: 6px solid transparent; border-left-color: #c42b1c; border-top-color: #c42b1c; }
.note h4 { margin: 0 0 6px; font-size: 12.5px; }
.note ul { margin: 0; padding-left: 18px; }
.note li { margin: 3px 0; }
.note .by { font-weight: 700; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

/* home layout */
.home-grid { display: flex; gap: calc(var(--cw) * .5); align-items: flex-start; flex-wrap: wrap; padding-left: 6px; }
.home-side { display: flex; flex-direction: column; gap: 14px; }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 50px; padding: 4px 2px 0; }
.spark i { width: 14px; background: var(--accent); border-radius: 2px 2px 0 0; opacity: .85; animation: barUp .7s cubic-bezier(.2,.8,.2,1) both; transform-origin: bottom; }
.spark i.zero { background: var(--line); }
@keyframes barUp { from { transform: scaleY(0); } }
.spark-l { display: flex; gap: 4px; font-size: 9.5px; color: var(--soft); padding: 0 2px; }
.spark-l span { width: 14px; text-align: center; }

/* ---------- Feuille de jeu ---------- */
.play { display: flex; gap: calc(var(--cw) * .6); align-items: flex-start; flex-wrap: wrap; padding-left: 6px; }
.play-main { display: flex; flex-direction: column; gap: 12px; }
.play-side { display: flex; flex-direction: column; gap: 14px; width: min(360px, 100%); }
.board-card { width: max-content; max-width: 100%; overflow-x: auto; background: var(--bg); padding: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; }
.board-card .chrome { position: absolute; top: -1px; left: -1px; right: -1px; height: 4px; background: var(--gc, var(--accent)); }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); background: var(--accent-ll); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-d); }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; background: var(--bg); }
.chip.ok { background: #c6efce; border-color: #8fd19e; color: #006100; }
.chip.ko { background: #ffc7ce; border-color: #f2a0aa; color: #9c0006; }
.banner { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #8fd19e; background: #e9f7ec; color: #0b5d2a; font-size: 13px; border-radius: 4px; }
:root[data-theme="dark"] .banner { background: #1d3b26; color: #b6e8c4; border-color: #2f6b40; }
.banner.libre { background: #fff4ce; border-color: #e5cf73; color: #6b5500; }
:root[data-theme="dark"] .banner.libre { background: #3b3519; color: #f1dc84; border-color: #6b5f26; }

.board { display: grid; width: max-content; grid-template-columns: repeat(var(--n), var(--cs)); grid-auto-rows: var(--cs); position: relative; touch-action: none; user-select: none; -webkit-user-select: none; border: 2px solid #3b3a39; background: var(--bg); }
.gcell { position: relative; border: 1px solid rgba(0,0,0,.14); display: grid; place-items: center; font-family: var(--cell-font); cursor: pointer; transition: background-color .15s, transform .12s, color .15s; font-size: calc(var(--cs) * .44); }
:root[data-theme="dark"] .gcell { border-color: rgba(255,255,255,.1); }
.gcell:hover { box-shadow: inset 0 0 0 2px var(--accent); z-index: 2; }
.gcell.flash { animation: flash .9s ease; z-index: 3; }
@keyframes flash { 0%, 100% { box-shadow: inset 0 0 0 0 #ffd43b; } 30% { box-shadow: inset 0 0 0 4px #ffd43b; transform: scale(1.06); } }
.nope { animation: nope .35s ease; }
@keyframes nope { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.wave { animation: wave .7s ease both; }
@keyframes wave { 0% { transform: scale(1); } 40% { transform: scale(.82); filter: brightness(1.15) saturate(1.3); } 100% { transform: scale(1); } }

/* couronnes */
.b-crowns .gcell { color: #3b3a39; }
.b-crowns .gcell.bt { border-top: 2.5px solid #3b3a39; }
.b-crowns .gcell.bb { border-bottom: 2.5px solid #3b3a39; }
.b-crowns .gcell.bl { border-left: 2.5px solid #3b3a39; }
.b-crowns .gcell.br { border-right: 2.5px solid #3b3a39; }
.b-crowns .gcell.x { font-size: calc(var(--cs) * .3); color: rgba(0,0,0,.42); }
.b-crowns .gcell.crown { font-size: calc(var(--cs) * .6); animation: pop .25s ease; color: #1b1a19; }
.b-crowns .gcell.bad { background-image: repeating-linear-gradient(45deg, rgba(196,43,28,.35) 0 5px, transparent 5px 10px) !important; color: var(--danger); }
:root[data-theme="dark"] .b-crowns .gcell { filter: saturate(.85) brightness(.82); }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* binaire */
.b-bin .gcell { font-weight: 700; font-size: calc(var(--cs) * .5); }
.b-bin .gcell.given { background: var(--head); cursor: default; }
.b-bin .gcell.v1 { color: #0b6a3a; }
.b-bin .gcell.v0 { color: #b45309; }
.b-bin .gcell.v1::before, .b-bin .gcell.v0::before { content: ""; position: absolute; inset: 18%; border-radius: 50%; z-index: -1; animation: pop .22s ease; }
.b-bin .gcell { z-index: 0; isolation: isolate; }
.b-bin .gcell.v1::before { background: #c6efce; }
.b-bin .gcell.v0::before { background: #ffe0b2; border-radius: 6px; }
.b-bin .gcell.bad { background: #ffc7ce; }
.cons { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1.5px solid #3b3a39; display: grid; place-items: center; font-size: 12px; font-weight: 700; z-index: 4; pointer-events: none; line-height: 1; }
.cons.bad { background: var(--danger); color: #fff; border-color: var(--danger); }

/* liaison */
.b-path .gcell { cursor: crosshair; }
.b-path .gcell.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.b-path .gcell.wr { border-right: 4px solid #3b3a39; }
.b-path .gcell.wl { border-left: 4px solid #3b3a39; }
.b-path .gcell.wb { border-bottom: 4px solid #3b3a39; }
.b-path .gcell.wt { border-top: 4px solid #3b3a39; }
:root[data-theme="dark"] .b-path .gcell[class*="w"] { border-color: rgba(255,255,255,.1); }
.pathsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.pline { fill: none; stroke: var(--accent); stroke-width: .38; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.pnum { position: relative; z-index: 3; width: 62%; height: 62%; border-radius: 50%; background: #1b1a19; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: calc(var(--cs) * .34); pointer-events: none; }
.b-path .gcell.head .pnum, .b-path .gcell.on .pnum { background: var(--accent-d); box-shadow: 0 0 0 3px var(--bg); }

/* somme */
.b-sum .gcell { font-weight: 600; font-size: calc(var(--cs) * .42); }
.b-sum .gcell.off { color: var(--soft); background: var(--head); }
.b-sum .gcell.off::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%; height: 2px; background: var(--danger); transform: rotate(-20deg); }
.b-sum .gcell.keep::before { content: ""; position: absolute; inset: 14%; border: 2.5px solid var(--ok); border-radius: 50%; animation: pop .2s ease; }
.tot { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--head); border: 1px solid var(--line); font-family: var(--cell-font); line-height: 1.05; transition: background .2s; }
.tot b { font-size: calc(var(--cs) * .36); }
.tot small { font-size: calc(var(--cs) * .22); color: var(--soft); }
.tot.ok { background: #c6efce; color: #006100; }
.tot.ok small { color: #2f7d44; }
.tot.under { background: #ffc7ce; color: #9c0006; }
.tot.corner { font-size: calc(var(--cs) * .4); color: var(--accent); font-weight: 700; }

/* pixels */
.nono { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 0; --pcs: calc(var(--cs) * .82); }
.nono .board { grid-template-columns: repeat(var(--n), var(--pcs)); grid-auto-rows: var(--pcs); }
.corner-tool { display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 8px 8px 0; }
.cclues { display: grid; grid-template-columns: repeat(var(--n), var(--pcs)); align-items: end; border-left: 2px solid transparent; }
.rclues { display: grid; grid-auto-rows: var(--pcs); border-top: 2px solid transparent; }
.cclues .clue { display: flex; flex-direction: column; align-items: center; gap: 1px; padding-bottom: 4px; font-weight: 600; font-size: 13px; font-family: var(--cell-font); }
.rclues .clue { display: flex; align-items: center; justify-content: flex-end; gap: 7px; padding-right: 8px; font-weight: 600; font-size: 13px; font-family: var(--cell-font); }
.clue.ok { color: var(--soft); text-decoration: line-through; font-weight: 400; }
.b-pix .gcell.sep-r { border-right: 2px solid #3b3a39; }
.b-pix .gcell.sep-b { border-bottom: 2px solid #3b3a39; }
.b-pix .gcell.fill { background: #3b3a39; }
:root[data-theme="dark"] .b-pix .gcell.fill { background: #e0e0e0; }
.b-pix .gcell.cross::after { content: "✕"; color: var(--soft); font-size: calc(var(--cs) * .3); }
.b-pix .gcell.reveal { background: var(--pix) !important; transition: background-color .5s ease; }
.nono.won .b-pix .gcell:not(.fill) { background: var(--bg); }
.tool .sw { width: 12px; height: 12px; display: inline-grid; place-items: center; font-style: normal; font-size: 10px; }
.tool .sw.fill { background: #3b3a39; }

/* recherchev */
.vl-wrap { display: flex; flex-direction: column; gap: 10px; width: min(520px, 80vw); }
.vlookup { border: 1px solid var(--line); font-family: var(--cell-font); }
.vl-row { display: grid; grid-template-columns: 100px 1fr; height: 40px; border-bottom: 1px solid var(--line); }
.vl-row:last-child { border-bottom: 0; }
.vl-k { background: var(--head); color: var(--muted); display: flex; align-items: center; padding-left: 10px; font-size: 12.5px; border-right: 1px solid var(--line); }
.vl-val { display: flex; align-items: center; padding-left: 12px; font-size: 18px; font-weight: 600; }
.vl-row.hidden .vl-val { color: var(--danger); font-weight: 400; font-size: 14px; letter-spacing: .5px; font-family: var(--cell-font); }
.vl-row.hidden .vl-val::before { content: "⚠"; margin-right: 6px; font-size: 12px; }
.vl-row.reveal .vl-val { animation: revealCell .6s ease; }
@keyframes revealCell { 0% { background: #ffeb9c; } 100% { background: transparent; } }
.vl-answer { display: grid; grid-template-columns: 100px 1fr; height: 46px; border: 2px solid var(--accent); font-family: var(--cell-font); }
.vl-answer .lbl { background: var(--accent); color: #fff; display: flex; align-items: center; padding-left: 10px; font-weight: 700; }
.vl-answer .v { display: flex; align-items: center; padding-left: 12px; font-size: 20px; font-weight: 700; }
.vl-answer.ok .v { background: #c6efce; color: #006100; }
.vl-answer.ko .v { background: #ffeb9c; color: #9c5700; }
.vl-form { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vl-form .fx { font-family: Consolas, Menlo, monospace; color: var(--accent); font-weight: 700; }
.vl-input { flex: 1; min-width: 140px; height: 32px; border: 1px solid var(--line); border-bottom: 2px solid var(--accent); padding: 0 8px; background: var(--bg); outline: 0; font-family: var(--cell-font); font-size: 15px; }
.vl-guesses { display: flex; gap: 6px; flex-wrap: wrap; min-height: 26px; }

/* panneau résultats du jour */
.mini h5 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }

/* ---------- Onglets de feuilles ---------- */
.tabsbar { display: flex; align-items: stretch; height: 32px; background: var(--chrome); border-top: 1px solid var(--line); user-select: none; }
.tabnav { display: flex; align-items: center; padding: 0 4px; gap: 0; border-right: 1px solid var(--line); }
.tabnav button { background: none; border: 0; width: 24px; height: 24px; color: var(--soft); border-radius: 3px; font-size: 11px; }
.tabnav button:hover { background: rgba(0,0,0,.06); color: var(--text); }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; flex: 1; scroll-behavior: smooth; }
.tabs::-webkit-scrollbar { display: none; }
.stab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 0; background: none; border-right: 1px solid var(--line); white-space: nowrap; color: var(--text); font-size: 12.5px; }
.stab:hover { background: rgba(0,0,0,.04); }
.stab .tc { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--tc, transparent); opacity: .85; }
.stab.active { background: var(--bg); color: var(--accent); font-weight: 600; box-shadow: 0 -2px 0 var(--accent) inset; }
.stab.active .tc { display: none; }
.stab .ok { color: var(--ok); font-size: 11px; }
.stab.add { color: var(--soft); font-size: 18px; padding: 0 12px; }
.stab.add:hover { color: var(--accent); }
.hscroll { width: 30%; max-width: 360px; display: flex; align-items: center; padding: 0 8px; border-left: 1px solid var(--line); }
.hscroll i { display: block; height: 8px; width: 40%; background: #c8c6c4; border-radius: 4px; }

/* ---------- Barre d'état ---------- */
.statusbar { display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 10px; background: var(--chrome); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); user-select: none; white-space: nowrap; }
.statusbar .mode { display: flex; align-items: center; gap: 6px; min-width: 120px; }
.statusbar .mode .prog { width: 80px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: none; }
.statusbar .mode .prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.statusbar .mode.calc .prog { display: block; }
.statusbar .grow { flex: 1; }
.statusbar .agg { display: flex; gap: 14px; }
.statusbar .views { display: flex; gap: 2px; }
.statusbar .views button { background: none; border: 0; width: 24px; height: 20px; border-radius: 3px; color: var(--soft); }
.statusbar .views button.on { background: var(--head-sel); color: var(--text); }
.zoom { display: flex; align-items: center; gap: 6px; }
.zoom button { background: none; border: 0; width: 18px; height: 18px; color: var(--muted); font-size: 15px; line-height: 1; padding: 0; }
.zoom input { width: 100px; accent-color: var(--accent); }
.zoom output { width: 40px; text-align: right; }
.timer { font-variant-numeric: tabular-nums; }
body.zen .timer { visibility: hidden; }
.acc-ok { color: var(--ok); }

/* ---------- Dialogues, toasts, backstage ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: grid; place-items: center; z-index: 100; animation: fade .18s ease; padding: 16px; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--bg); width: min(460px, 100%); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: dlg .25s cubic-bezier(.2,.8,.2,1); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; }
.dialog.wide { width: min(620px, 100%); }
@keyframes dlg { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.dialog .dh { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
.dialog .dh button { background: none; border: 0; width: 28px; height: 28px; border-radius: 4px; font-size: 16px; color: var(--muted); }
.dialog .dh button:hover { background: #c42b1c; color: #fff; }
.dialog .db { padding: 16px; overflow: auto; }
.dialog .df { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--chrome-2); flex-wrap: wrap; }
.dialog textarea, .dialog input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--bg); padding: 8px; font-family: Consolas, Menlo, monospace; font-size: 12px; border-radius: 3px; outline-color: var(--accent); }
.dialog textarea { height: 110px; resize: vertical; word-break: break-all; }
.dialog p { margin: 0 0 10px; }
.dialog .muted { color: var(--muted); font-size: 12.5px; }
.players-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.ppick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; transition: transform .15s, border-color .15s, box-shadow .15s; }
.ppick:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }
.ppick .avatar { width: 46px; height: 46px; font-size: 15px; border: 0; }
.ppick.cur { border-color: var(--accent); background: var(--accent-ll); }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; }

.win-hero { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.win-badge { width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; font-size: 32px; color: #fff; background: var(--accent); flex: none; animation: pop .5s ease; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
.win-time { font-size: 30px; font-weight: 700; font-family: var(--cell-font); font-variant-numeric: tabular-nums; }
.win-msg { color: var(--muted); font-style: italic; }

.toasts { position: fixed; right: 16px; bottom: 70px; display: flex; flex-direction: column; gap: 8px; z-index: 120; pointer-events: none; }
.toast { background: #323130; color: #fff; padding: 9px 14px; border-radius: 4px; box-shadow: var(--shadow); font-size: 13px; animation: toastIn .3s cubic-bezier(.2,.8,.2,1); max-width: 340px; }
.toast.out { animation: toastOut .3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }

.backstage { position: fixed; inset: 0; z-index: 90; display: grid; grid-template-columns: 220px 1fr; background: var(--bg); animation: bsIn .3s cubic-bezier(.2,.8,.2,1); }
@keyframes bsIn { from { opacity: 0; transform: translateX(-30px); } }
.bs-nav { background: var(--accent); color: #fff; display: flex; flex-direction: column; padding: 10px 0; }
.bs-nav button { background: none; border: 0; color: #fff; text-align: left; padding: 10px 22px; font-size: 14px; }
.bs-nav button:hover { background: rgba(255,255,255,.12); }
.bs-nav button.on { background: rgba(0,0,0,.18); }
.bs-nav .back { font-size: 22px; padding: 6px 18px 16px; }
.bs-body { padding: 30px 40px; overflow: auto; }
.bs-body h1 { font-weight: 300; font-size: 32px; margin: 0 0 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; max-width: 900px; }
.tile { border: 1px solid var(--line); background: var(--bg); padding: 0; text-align: left; transition: transform .15s, box-shadow .15s; }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.tile .thumb { height: 92px; display: grid; place-items: center; font-size: 36px; color: #fff; position: relative; overflow: hidden; }
.tile .thumb::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(255,255,255,.18) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.18) 1px, transparent 1px); background-size: 20px 12px; }
.tile .meta { padding: 8px 10px; }
.tile .meta b { display: block; }
.tile .meta span { font-size: 12px; color: var(--muted); }

/* confettis-cellules */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 110; }

/* menu contextuel */
.ctx { position: fixed; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 4px; z-index: 130; min-width: 190px; animation: fade .12s; }
.ctx button { display: flex; gap: 10px; width: 100%; background: none; border: 0; text-align: left; padding: 6px 10px; border-radius: 3px; font-size: 12.5px; }
.ctx button:hover { background: var(--accent-l); }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* graphique barres */
.chart { border: 1px solid var(--line); background: var(--bg); padding: 12px 14px 8px; width: min(440px, 86vw); }
.chart h4 { margin: 0 0 10px; font-size: 13px; text-align: center; font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 18px; height: 150px; border-bottom: 1px solid var(--soft); padding: 0 10px; background-image: linear-gradient(to top, var(--grid) 1px, transparent 1px); background-size: 100% 30px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; max-width: 70px; }
.bar i { width: 100%; border-radius: 2px 2px 0 0; animation: barUp .9s cubic-bezier(.2,.8,.2,1) both; transform-origin: bottom; }
.bar b { font-size: 12px; margin-bottom: 3px; }
.bar-l { display: flex; gap: 18px; padding: 4px 10px 0; }
.bar-l span { flex: 1; max-width: 70px; text-align: center; font-size: 12px; color: var(--muted); }

.cscale { font-variant-numeric: tabular-nums; }

/* ---------- Petits écrans ---------- */
@media (max-width: 760px) {
  :root { --cs: 40px; --cw: 56px; --hw: 30px; }
  .search { display: none; }
  .titlebar .doc { text-align: left; }
  .qat { display: none; }
  .ribbon { height: 0; border-bottom: 0; }
  .ribbon.open-mobile { height: 96px; border-bottom: 1px solid var(--line); }
  .statusbar .agg, .statusbar .views, .hscroll, .zoom input { display: none; }
  .sheet { padding-left: 8px; padding-right: 8px; }
  .s-title .big { font-size: 21px; }
  .backstage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .bs-nav { flex-direction: row; overflow-x: auto; padding: 0; }
  .bs-nav button { padding: 12px 14px; white-space: nowrap; }
  .bs-body { padding: 20px 16px; }
  .namebox { width: 64px; }
}
@media (max-width: 420px) { :root { --cs: 36px; } }
.play-main .toolbar, .play-main .banner { width: 0; min-width: 100%; }
.play-main { min-width: min(480px, calc(100vw - 32px)); }

/* ---------- Serpent ---------- */
.sheet[data-sheet="snake"] { min-height: 100%; }
.snake-zone { position: absolute; outline: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 4%, transparent); touch-action: none; user-select: none; -webkit-user-select: none; cursor: cell; overflow: hidden; }
.sn-cell { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--rh); font-family: var(--cell-font); font-size: 13px; line-height: var(--rh); text-align: right; padding-right: 5px; transition-property: transform; transition-timing-function: linear; will-change: transform; }
body.noanim .sn-cell { transition: none !important; }
.sn-body { background: color-mix(in srgb, #1e7145 calc((1 - var(--t)) * 100%), #a9d08e); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); font-weight: 600; }
.sn-head { background: color-mix(in srgb, var(--accent) 22%, var(--bg)); box-shadow: inset 0 0 0 2px var(--accent); z-index: 2; }
.sn-head::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 6px; height: 6px; background: var(--accent); border: 1px solid var(--bg); }
.sn-head.sn-dead { box-shadow: inset 0 0 0 2px var(--danger); background: #ffc7ce; }
.sn-food { z-index: 1; font-weight: 700; background: #fff2b3; box-shadow: inset 0 0 0 1px #e5cf73; color: #6b5500; transition: none; }
.sn-food::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px #e5b800; opacity: 0; animation: foodIn .45s ease-out both; }
@keyframes foodIn { 0% { opacity: 1; box-shadow: inset 0 0 0 6px #ffd54f; } 100% { opacity: 1; box-shadow: inset 0 0 0 1px #e5cf73; } }
.sn-food.gold { background: linear-gradient(135deg, #ffe082, #ffb300); color: #4a3200; box-shadow: inset 0 0 0 1px #c79100; }

@keyframes wallIn { from { opacity: 0; } }
.sn-plus { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--rh); line-height: var(--rh); text-align: center; font-weight: 800; font-family: var(--cell-font); color: var(--ok); pointer-events: none; z-index: 4; animation: plusUp .8s ease-out forwards; }
.sn-plus.gold { color: #b07800; }
@keyframes plusUp { to { margin-top: -26px; opacity: 0; } }
.sn-msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 220px; z-index: 5; font-size: 13px; }
.sn-msg b { font-size: 16px; }

.sn-kpis { display: flex; gap: 6px; }

.sn-kpi .v { font-size: 20px; font-variant-numeric: tabular-nums; }

<script>
/* =========================================================
   Détente.xlsx — noyau : hasard seedé, stockage, joueurs, résultats, partage
   ========================================================= */
(function () {
  'use strict';

  /* ---------- Hasard déterministe (même puzzle pour tout le monde) ---------- */
  function hashStr(s) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) {
      const ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h1 >>> 0) ^ (h2 >>> 0);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const r = mulberry32(hashStr(String(seed)) >>> 0);
    r.int = (n) => Math.floor(r() * n);
    r.pick = (a) => a[r.int(a.length)];
    r.shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = r.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    r.seed = String(seed);
    return r;
  }

  /* ---------- Dates ---------- */
  function todayKey(d = new Date()) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function prettyDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function shortDate(key) { const [y, m, d] = key.split('-'); return `${d}/${m}`; }
  function addDays(key, n) {
    const [y, m, d] = key.split('-').map(Number);
    return todayKey(new Date(y, m - 1, d + n));
  }
  function fmtTime(sec) {
    if (sec == null || isNaN(sec)) return '—';
    sec = Math.round(sec);
    const m = Math.floor(sec / 60), s = sec % 60;
    if (m >= 60) return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  /* ---------- Stockage local robuste ---------- */
  const NS = 'detente-xlsx:';
  const store = {
    get(k, def) { try { const v = localStorage.getItem(NS + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) { /* mode privé */ } },
    del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} }
  };

  /* ---------- Joueurs ---------- */
  const PLAYER_COLORS = ['#217346', '#2b6cb0', '#c05621', '#805ad5', '#b83280', '#2c7a7b', '#975a16', '#c53030'];
  // La bande : liste fixe, pas besoin d'en ajouter
  const FIXED_PLAYERS = ['Lucas', 'Rémi', 'Baptou', 'Anouchka'];
  const players = {
    list() { return FIXED_PLAYERS.slice(); },
    add(name) {
      return false; // liste fixe
      name = String(name || '').trim().slice(0, 18);
      if (!name) return false;
      const l = players.list();
      if (l.some((p) => p.toLowerCase() === name.toLowerCase())) return false;
      l.push(name); store.set('players', l); sync.pushPlayer(name); return true;
    },
    remove(name) { store.set('players', players.list().filter((p) => p !== name)); },
    current() { const p = store.get('player', null); return FIXED_PLAYERS.includes(p) ? p : null; },
    setCurrent(n) { store.set('player', n); },
    color(name) { const i = Math.abs(hashStr(name || '?')) % PLAYER_COLORS.length; return PLAYER_COLORS[i]; },
    initials(name) { return (name || '?').slice(0, 2).toUpperCase(); }
  };


  /* ---------- Synchronisation partagée (base du lien jouable claude.ai) ----------
     Sur GitHub Pages (pas de base), tout reste local + partage par lien. */
  const enc = (s) => encodeURIComponent(String(s)).replace(/[!'()*]/g, (c) => '%' + c.charCodeAt(0).toString(16)).replace(/%/g, '~').slice(0, 190) || 'x';
  const snakeScores = {
    all() { return store.get('snake', {}); },
    submit(p, score) {
      const m = snakeScores.all();
      if (!p || score <= (m[p] || 0)) return false;
      m[p] = score; store.set('snake', m); sync.pushSnake(p, score); return true;
    },
    mergeRemote(list) {
      const m = snakeScores.all(); let ch = false;
      for (const x of list) if (x && x.p && +x.best > (m[x.p] || 0)) { m[String(x.p).slice(0, 18)] = +x.best; ch = true; }
      if (ch) store.set('snake', m); return ch;
    }
  };
  const sync = {
    db: null, state: 'local', fns: [],
    onChange(fn) { sync.fns.push(fn); },
    emit() { sync.fns.forEach((f) => { try { f(sync.state); } catch (e) { console.error(e); } }); },
    async write(path, data) {
      if (!sync.db) return;
      try { await sync.db.doc(path).set(data); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 600 + Math.random() * 800)); try { await sync.db.doc(path).set(data); return; } catch (e2) { e = e2; } }
        if (e && e.code === 'invalid_argument') { sync.state = 'readonly'; sync.emit(); }
        console.warn('sync', e);
      }
    },
    pushResult(r) { const c = Object.assign({}, r); for (const k in c) if (c[k] === undefined) delete c[k]; return sync.write('results/' + enc(r.id), c); },
    pushPlayer(name) { return sync.write('players/' + enc(name), { name }); },
    pushSnake(p, best) { return sync.write('snake/' + enc(p), { p, best }); },
    async init() {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      let db = null; try { db = await window.claude.use('db'); } catch (e) {}
      if (!db) return;
      sync.db = db; sync.state = 'connecting'; sync.emit();
      const remoteIds = new Set(); let uploaded = false;
      const timer = setTimeout(() => { if (sync.state === 'connecting') { sync.state = 'offline'; sync.emit(); } }, 10000);
      db.collection('results').onSnapshot((snap) => {
        const list = snap.docs.map((d) => d.data()).filter(Boolean);
        list.forEach((r) => remoteIds.add(r.id));
        const n = results.merge(list);
        if (!snap.metadata.fromCache) {
          clearTimeout(timer);
          if (sync.state !== 'readonly') sync.state = 'online';
          if (!uploaded) {
            uploaded = true;
            (async () => { for (const r of results.all()) if (!remoteIds.has(r.id)) await sync.pushResult(r); })();
            (async () => { for (const p of players.list()) await sync.pushPlayer(p); })();
            (async () => { const m = snakeScores.all(); for (const p in m) await sync.pushSnake(p, m[p]); })();
          }
        }
        if (n || !snap.metadata.fromCache) sync.emit();
      }, (e) => { clearTimeout(timer); sync.state = 'offline'; sync.emit(); });
      db.collection('players').onSnapshot((snap) => {
        let ch = false;
        snap.docs.forEach((d) => { const v = d.data(); if (v && v.name) { const l = players.list(); if (!l.some((p) => p.toLowerCase() === String(v.name).toLowerCase())) { l.push(String(v.name).slice(0, 18)); store.set('players', l); ch = true; } } });
        if (ch) sync.emit();
      }, () => {});
      db.collection('snake').onSnapshot((snap) => { if (snakeScores.mergeRemote(snap.docs.map((d) => d.data()))) sync.emit(); }, () => {});
    }
  };

  /* ---------- Résultats ----------
     r = { id, p: joueur, g: jeu, d: 'YYYY-MM-DD' | 'libre', t: secondes, h: indices, s: score annexe, ts } */
  const results = {
    all() { return store.get('results', []); },
    save(list) { store.set('results', list); },
    add(r) {
      const l = results.all();
      r.id = r.id || (r.p + '|' + r.g + '|' + r.d + (r.d === 'libre' ? '|' + Date.now().toString(36) : ''));
      if (l.some((x) => x.id === r.id)) return false; // premier résultat du jour = celui qui compte
      r.ts = r.ts || Date.now();
      l.push(r); results.save(l); sync.pushResult(r); return true;
    },
    daily(p, g, d) { return results.all().find((r) => r.p === p && r.g === g && r.d === d) || null; },
    forDay(d) { return results.all().filter((r) => r.d === d); },
    merge(incoming) {
      const l = results.all(); const ids = new Set(l.map((r) => r.id));
      let n = 0;
      for (const r of incoming) {
        if (!r || !r.id || !r.p || !r.g || ids.has(r.id)) continue;
        l.push({ id: String(r.id), p: String(r.p).slice(0, 18), g: String(r.g), d: String(r.d), t: +r.t || 0, h: +r.h || 0, s: r.s == null ? undefined : +r.s, ts: +r.ts || Date.now() });
        ids.add(r.id); n++;

  };

  /* ---------- Stats « zen » ---------- */
  function streak(p, today) {
    const days = new Set(results.all().filter((r) => r.p === p && r.d !== 'libre').map((r) => r.d));
    let n = 0, k = today;
    if (!days.has(k)) k = addDays(k, -1); // la série n'est pas cassée tant que la journée n'est pas finie
    while (days.has(k)) { n++; k = addDays(k, -1); }
    return n;
  }
  function statsFor(p, today) {
    const rs = results.all().filter((r) => r.p === p);
    const daily = rs.filter((r) => r.d !== 'libre');
    const libre = rs.filter((r) => r.d === 'libre');
    const clean = rs.filter((r) => !r.h).length;
    const zen = daily.length * 10 + libre.length * 5 + clean * 3 + streak(p, today) * 2;
    const avg = daily.length ? daily.reduce((a, r) => a + r.t, 0) / daily.length : null;
    return { p, daily: daily.length, libre: libre.length, clean, zen, avg, streak: streak(p, today), today: daily.filter((r) => r.d === today).length };
  }
  const TITLES = [
    [0, 'Stagiaire du tableur'], [30, 'Apprenti des cellules'], [80, 'Maître du copier-coller'],
    [150, 'Virtuose de la RECHERCHEV'], [260, 'Architecte du TCD'], [400, 'Sage de la macro'], [650, 'Légende du classeur']
  ];
  function titleFor(zen) { let t = TITLES[0][1]; for (const [n, s] of TITLES) if (zen >= n) t = s; return t; }

  /* ---------- Partage sans serveur : code compact + lien ---------- */
  function b64e(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

  const share = {
    encode(list) {
      const rows = list.map((r) => [r.p, r.g, r.d, r.t, r.h || 0, r.s == null ? '' : r.s, r.ts, r.d === 'libre' ? r.id : '']);
      return 'XLJ1.' + b64e(JSON.stringify(rows));
    },
    decode(code) {
      code = String(code || '').trim();
      const m = code.match(/XLJ1\.([A-Za-z0-9_-]+)/);
      if (!m) throw new Error('Code non reconnu');
      const rows = JSON.parse(b64d(m[1]));
      return rows.map(([p, g, d, t, h, s, ts, id]) => ({ p, g, d, t, h, s: s === '' ? undefined : s, ts, id: id || (p + '|' + g + '|' + d) }));
    },
    // Par défaut : les résultats des 45 derniers jours (le lien reste court)
    exportCode(onlyPlayer) {
      const since = Date.now() - 45 * 864e5;
      const l = results.all().filter((r) => r.ts >= since && (!onlyPlayer || r.p === onlyPlayer));
      return share.encode(l);
    },
    link(code) {
      const base = location.href.split('#')[0].split('?')[0];
      return base + '#import=' + code;
    }
  };

  window.XL = { sync, snakeScores, hashStr, makeRng, todayKey, prettyDate, shortDate, addDays, fmtTime, store, players, results, statsFor, streak, titleFor, share };
})();

<script>
/* =========================================================
   Détente.xlsx — les 6 casse-têtes
   Chaque jeu : { id, name, fn, icon, color, tagline, rules[], create(root, api) }
   create() renvoie { hint(), reset(), undo(), info() }
   api = { rng, mode, win(extra), formula(text), sound(name) }
   ========================================================= */
(function () {
  'use strict';

  /* ---------- petits utilitaires DOM ---------- */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (v[sk] == null) continue; if (sk.startsWith('--')) e.style.setProperty(sk, v[sk]); else e.style[sk] = v[sk]; } }
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);

  }
  const nbrs = (i, N) => {
    const r = Math.floor(i / N), c = i % N, out = [];
    if (r > 0) out.push(i - N); if (r < N - 1) out.push(i + N);
    if (c > 0) out.push(i - 1); if (c < N - 1) out.push(i + 1);
    return out;
  };
  const colName = (c) => { let s = ''; c++; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; };
  const ref = (r, c) => colName(c) + (r + 1);
  function cellFromEvent(e, board) {
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const c = t && t.closest && t.closest('[data-i]');
    return c && board.contains(c) ? +c.dataset.i : -1;
  }
  function history(get, set) {
    const st = [];
    return {
      push() { st.push(JSON.stringify(get())); if (st.length > 200) st.shift(); },
      dropIfSame() { if (st.length && st[st.length - 1] === JSON.stringify(get())) st.pop(); },
      undo() { if (!st.length) return false; set(JSON.parse(st.pop())); return true; },
      clear() { st.length = 0; }
    };
  }
  function pulse(el, cls = 'flash') { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function boardWrap(N, cls) {
    const b = h('div', { class: 'board ' + cls, style: { '--n': N } });
    return b;
  }

  const GAMES = [];

  /* =========================================================
     1. COURONNES — une couronne par ligne, colonne et zone, sans contact
     ========================================================= */
  const REGION_COLORS = ['#f8c8a8', '#bfe3c0', '#b9d4f5', '#f3e3a1', '#dcc4f0', '#f6b9c9', '#bfe7e4', '#d9d9d9', '#f1cfa0', '#c8d9a6'];

  function placeQueens(rng, N) {
    const pos = [], used = new Array(N).fill(false);
    (function bt(r) {
      if (r === N) return true;
      for (const c of rng.shuffle([...Array(N).keys()])) {
        if (used[c] || (r > 0 && Math.abs(c - pos[r - 1]) <= 1)) continue;
        used[c] = true; pos[r] = c;
        if (bt(r + 1)) return true;
        used[c] = false;
      }
      return false;
    })(0);
    return pos.slice();
  }
  function growRegions(rng, N, q) {
    const reg = new Array(N * N).fill(-1);
    q.forEach((c, r) => (reg[r * N + c] = r));
    const w = q.map(() => Math.pow(0.15 + rng() * 0.85, 2));
    let left = N * N - N;
    while (left > 0) {
      const fronts = [];
      for (let k = 0; k < N; k++) {
        const f = [];
        for (let i = 0; i < N * N; i++) if (reg[i] < 0 && nbrs(i, N).some((j) => reg[j] === k)) f.push(i);
        if (f.length) fronts.push([k, f]);
      }
      let tot = fronts.reduce((a, [k]) => a + w[k], 0), x = rng() * tot, pick = fronts[0];
      for (const fr of fronts) { x -= w[fr[0]]; if (x <= 0) { pick = fr; break; } }
      reg[rng.pick(pick[1])] = pick[0]; left--;

  }
  function countQueens(N, reg, limit) {
    let n = 0; const col = new Array(N).fill(false), rg = new Array(N).fill(false);
    (function bt(r, prev) {

      for (let c = 0; c < N; c++) {
        const g = reg[r * N + c];

        col[c] = rg[g] = true; bt(r + 1, c); col[c] = rg[g] = false;
      }
    })(0, -9);
    return n;
  }
  function genCouronnes(rng, N) {
    let first = null;
    for (let a = 0; a < 500; a++) {
      const q = placeQueens(rng, N), reg = growRegions(rng, N, q);
      if (!first) first = { reg, sol: q };
      if (countQueens(N, reg, 2) === 1) return { reg, sol: q, unique: true };
    }
    return first;
  }

  GAMES.push({
    id: 'couronnes', name: 'Couronnes', fn: 'COURONNES', icon: '♛', color: '#c05621',
    tagline: 'Une couronne par ligne, colonne et zone de couleur.',
    mech: 'Placement logique', minutes: '3-6 min',
    rules: [
      'Place exactement une ♛ dans chaque ligne, chaque colonne et chaque zone de couleur.',
      'Deux couronnes ne peuvent jamais se toucher, même en diagonale.',
      '1 clic = ✕ (repère), 2 clics = ♛, 3 clics = vide. Glisse pour poser plein de ✕ d\'un coup.'
    ],
    create(root, api) {
      const N = api.mode === 'libre' ? 6 + api.rng.int(3) : 7;
      const P = genCouronnes(api.rng, N);
      let st = new Array(N * N).fill(0), done = false;
      const hist = history(() => st, (s) => { st = s; render(); });
      const board = boardWrap(N, 'b-crowns');
      const cells = [];
      for (let i = 0; i < N * N; i++) {
        const r = Math.floor(i / N), c = i % N, g = P.reg[i];
        const el = h('div', { class: 'gcell', 'data-i': i, 'data-r': r, 'data-c': c, style: { background: REGION_COLORS[g % REGION_COLORS.length] } });
        if (r === 0 || P.reg[i - N] !== g) el.classList.add('bt');
        if (r === N - 1 || P.reg[i + N] !== g) el.classList.add('bb');
        if (c === 0 || P.reg[i - 1] !== g) el.classList.add('bl');
        if (c === N - 1 || P.reg[i + 1] !== g) el.classList.add('br');
        el.dataset.f = `=COURONNE(${ref(r, c)}; "zone ${g + 1}")`;
        cells.push(el); board.append(el);
      }
      root.append(board);

      function conflicts() {
        const cr = []; st.forEach((v, i) => v === 2 && cr.push(i));
        const bad = new Set();
        for (let a = 0; a < cr.length; a++) for (let b = a + 1; b < cr.length; b++) {
          const i = cr[a], j = cr[b], ri = Math.floor(i / N), ci = i % N, rj = Math.floor(j / N), cj = j % N;
          if (ri === rj || ci === cj || P.reg[i] === P.reg[j] || (Math.abs(ri - rj) <= 1 && Math.abs(ci - cj) <= 1)) { bad.add(i); bad.add(j); }
        }
        return { cr, bad };
      }
      function render() {
        const { cr, bad } = conflicts();
        cells.forEach((el, i) => {
          el.classList.toggle('x', st[i] === 1);
          el.classList.toggle('crown', st[i] === 2);
          el.classList.toggle('bad', bad.has(i));
          el.textContent = st[i] === 2 ? '♛' : st[i] === 1 ? '✕' : '';
        });
        api.formula(`=NB.SI(Plateau;"♛") → ${cr.length} / ${N}` + (bad.size ? '   ⚠ conflit' : ''));
        if (!done && cr.length === N && bad.size === 0) { done = true; api.win({}); }
      }
      let down = -1, dragged = false, seen = null;
      board.addEventListener('pointerdown', (e) => {
        if (done) return; const i = cellFromEvent(e, board); if (i < 0) return;
        e.preventDefault(); down = i; dragged = false; seen = new Set([i]); hist.push();
      });
      board.addEventListener('pointermove', (e) => {
        if (down < 0) return; const i = cellFromEvent(e, board);
        if (i < 0 || seen.has(i)) return;
        if (!dragged) { dragged = true; if (st[down] === 0) st[down] = 1; }
        seen.add(i); if (st[i] === 0) st[i] = 1; api.sound('soft'); render();
      });
      const up = () => {
        if (down < 0) return;
        if (!dragged) { st[down] = (st[down] + 1) % 3; api.sound(st[down] === 2 ? 'place' : 'tick'); }
        down = -1; hist.dropIfSame(); render();
      };
      window.addEventListener('pointerup', up);
      render();
      return {
        info: () => `${N}×${N}`,
        undo() { if (!done) hist.undo(); },
        reset() { if (done) return; hist.push(); st = st.map(() => 0); render(); },
        hint() {
          if (done) return false; hist.push();
          const wrong = st.findIndex((v, i) => v === 2 && P.sol[Math.floor(i / N)] !== i % N);
          if (wrong >= 0) { st[wrong] = 1; pulse(cells[wrong]); render(); return true; }
          const r = P.sol.findIndex((c, r) => st[r * N + c] !== 2);
          if (r < 0) return false;
          st[r * N + P.sol[r]] = 2; pulse(cells[r * N + P.sol[r]]); render(); return true;
        },
        destroy() { window.removeEventListener('pointerup', up); }
      };
    }
  });

  /* =========================================================
     2. BINAIRE — remplis la grille de 1 et de 0
     ========================================================= */
  function binOk(g, N, i, cons) {
    const r = Math.floor(i / N), c = i % N, v = g[i];
    let a = 0, b = 0;
    for (let k = 0; k < N; k++) { if (g[r * N + k] === v) a++; if (g[k * N + c] === v) b++; }
    if (a > N / 2 || b > N / 2) return false;
    if (c >= 2 && g[i - 1] === v && g[i - 2] === v) return false;
    if (r >= 2 && g[i - N] === v && g[i - 2 * N] === v) return false;
    if (cons) for (const k of cons[i]) {
      const o = k.a === i ? k.b : k.a; if (!g[o]) continue;
      if ((k.t === '=') !== (g[o] === v)) return false;
    }

  }
  function binFull(rng, N) {
    const g = new Array(N * N).fill(0);

      for (const v of rng.shuffle([1, 2])) { g[i] = v; if (binOk(g, N, i) && bt(i + 1)) return true; }
      g[i] = 0; return false;
    })(0);
    return g;
  }
  function binCount(N, givens, consList, limit) {
    const cons = Array.from({ length: N * N }, () => []);
    consList.forEach((k) => { cons[k.a].push(k); cons[k.b].push(k); });
    const g = new Array(N * N).fill(0); let n = 0;
    (function bt(i) {
      if (n >= limit) return;
      if (i === N * N) { n++; return; }
      const opts = givens[i] ? [givens[i]] : [1, 2];
      for (const v of opts) { g[i] = v; if (binOk(g, N, i, cons)) bt(i + 1); }
      g[i] = 0;
    })(0);
    return n;
  }
  function genBinaire(rng, N) {
    const sol = binFull(rng, N);
    const edges = [];
    for (let i = 0; i < N * N; i++) { if (i % N < N - 1) edges.push([i, i + 1]); if (i + N < N * N) edges.push([i, i + N]); }
    rng.shuffle(edges);
    const cons = edges.slice(0, 7 + rng.int(5)).map(([a, b]) => ({ a, b, t: sol[a] === sol[b] ? '=' : '×' }));
    const giv = sol.slice();
    for (const i of rng.shuffle([...Array(N * N).keys()])) {
      const keep = giv[i]; giv[i] = 0;
      if (binCount(N, giv, cons, 2) !== 1) giv[i] = keep;
    }
    // un peu de douceur : on rajoute 2 cases données
    const empt = rng.shuffle(giv.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0));
    empt.slice(0, 2).forEach((i) => (giv[i] = sol[i]));
    return { sol, giv, cons };
  }

  GAMES.push({
    id: 'binaire', name: 'Binaire', fn: 'BINAIRE', icon: '01', color: '#2b6cb0',
    tagline: 'Des 1 et des 0, en équilibre parfait.',
    mech: 'Logique binaire', minutes: '2-5 min',
    rules: [
      'Remplis chaque case avec un 1 ou un 0.',
      'Chaque ligne et chaque colonne contient autant de 1 que de 0.',
      'Jamais plus de deux symboles identiques à la suite.',
      '« = » : les deux cases sont identiques. « × » : elles sont différentes.'
    ],
    create(root, api) {
      const N = 6;
      const P = genBinaire(api.rng, N);
      let st = P.giv.slice(), done = false;
      const hist = history(() => st, (s) => { st = s; render(); });
      const board = boardWrap(N, 'b-bin');
      const cells = [];
      for (let i = 0; i < N * N; i++) {
        const r = Math.floor(i / N), c = i % N;
        const el = h('div', { class: 'gcell' + (P.giv[i] ? ' given' : ''), 'data-i': i, 'data-r': r, 'data-c': c });
        el.dataset.f = P.giv[i] ? `${ref(r, c)} = ${P.giv[i] === 1 ? 1 : 0}  (valeur fixe)` : `=SI(${ref(r, c)}="";"?";${ref(r, c)})`;
        cells.push(el); board.append(el);
      }
      const badges = P.cons.map((k) => {
        const r = Math.floor(k.a / N), c = k.a % N, hor = k.b === k.a + 1;
        const b = h('div', { class: 'cons', style: { left: `calc(var(--cs) * ${hor ? c + 1 : c + 0.5})`, top: `calc(var(--cs) * ${hor ? r + 0.5 : r + 1})` } }, k.t);
        board.append(b); return b;
      });
      root.append(board);
      function errors() {
        const bad = new Set(), badK = new Set();
        for (let r = 0; r < N; r++) for (const v of [1, 2]) {
          const row = [], col = [];
          for (let k = 0; k < N; k++) { if (st[r * N + k] === v) row.push(r * N + k); if (st[k * N + r] === v) col.push(k * N + r); }
          if (row.length > N / 2) row.forEach((i) => bad.add(i));
          if (col.length > N / 2) col.forEach((i) => bad.add(i));
        }
        for (let i = 0; i < N * N; i++) {
          const v = st[i]; if (!v) continue; const c = i % N;
          if (c <= N - 3 && st[i + 1] === v && st[i + 2] === v) [i, i + 1, i + 2].forEach((x) => bad.add(x));
          if (i + 2 * N < N * N && st[i + N] === v && st[i + 2 * N] === v) [i, i + N, i + 2 * N].forEach((x) => bad.add(x));
        }
        P.cons.forEach((k, j) => { if (st[k.a] && st[k.b] && ((k.t === '=') !== (st[k.a] === st[k.b]))) { badK.add(j); bad.add(k.a); bad.add(k.b); } });
        return { bad, badK };
      }
      function render() {
        const { bad, badK } = errors();
        cells.forEach((el, i) => {
          el.textContent = st[i] === 1 ? '1' : st[i] === 2 ? '0' : '';
          el.classList.toggle('v1', st[i] === 1); el.classList.toggle('v0', st[i] === 2);
          el.classList.toggle('bad', bad.has(i));
        });
        badges.forEach((b, j) => b.classList.toggle('bad', badK.has(j)));
        const filled = st.filter(Boolean).length;
        api.formula(`=NBVAL(Plateau) → ${filled} / ${N * N}` + (bad.size ? '   ⚠ règle enfreinte' : ''));
        if (!done && filled === N * N && !bad.size) { done = true; api.win({}); }
      }
      board.addEventListener('pointerdown', (e) => {
        if (done) return; const i = cellFromEvent(e, board); if (i < 0 || P.giv[i]) return;
        e.preventDefault(); hist.push(); st[i] = (st[i] + 1) % 3; api.sound(st[i] ? 'place' : 'tick'); render();
      });
      render();
      return {
        info: () => `${N}×${N}`,
        undo() { if (!done) hist.undo(); },
        reset() { if (done) return; hist.push(); st = P.giv.slice(); render(); },
        hint() {
          if (done) return false; hist.push();
          let i = st.findIndex((v, k) => v && v !== P.sol[k]);
          if (i < 0) { const e = st.map((v, k) => (v ? -1 : k)).filter((k) => k >= 0); if (!e.length) return false; i = e[Math.floor(Math.random() * e.length)]; }
          st[i] = P.sol[i]; pulse(cells[i]); render(); return true;
        }
      };
    }
  });

  /* =========================================================
     3. LIAISON — un seul trait qui passe partout, dans l'ordre
     ========================================================= */
  function hamPath(rng, N) {
    for (let t = 0; t < 600; t++) {
      const start = rng.int(N * N), vis = new Array(N * N).fill(false), path = [start];
      vis[start] = true; let cur = start;
      while (path.length < N * N) {
        const ns = nbrs(cur, N).filter((j) => !vis[j]);
        if (!ns.length) break;
        let best = [], bd = 9;
        for (const j of ns) { const d = nbrs(j, N).filter((k) => !vis[k]).length; if (d < bd) { bd = d; best = [j]; } else if (d === bd) best.push(j); }
        const nx = rng() < 0.12 ? rng.pick(ns) : rng.pick(best);
        vis[nx] = true; path.push(nx); cur = nx;
      }
      if (path.length === N * N) return path;
    }
    const p = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) p.push(r * N + (r % 2 ? N - 1 - c : c));
    return p;
  }
  const ekey = (a, b) => (a < b ? a + '-' + b : b + '-' + a);

  GAMES.push({
    id: 'liaison', name: 'Liaison', fn: 'LIAISON', icon: '↝', color: '#217346',
    tagline: 'Relie les nombres dans l\'ordre en remplissant tout.',
    mech: 'Tracé de chemin', minutes: '1-3 min',
    rules: [
      'Pars du 1 et trace un chemin continu jusqu\'au plus grand nombre.',
      'Passe par les nombres dans l\'ordre et remplis toutes les cases.',
      'Les traits épais sont des murs : on ne les traverse pas.',
      'Reviens en arrière en repassant sur ton trait, ou clique une case du chemin pour le couper.'
    ],
    create(root, api) {
      const N = api.mode === 'libre' ? 6 + api.rng.int(2) : 6;
      const sol = hamPath(api.rng, N);

  XL.sync.onChange((st) => {
    $('#saved').textContent = syncLabel();
    $('#saved').title = st === 'online' ? 'Les résultats de tous les joueurs sont partagés en direct' : st === 'readonly' ? 'Tu peux voir les résultats partagés, mais pas en ajouter (demande un accès Contributeur)' : 'Résultats gardés dans ce navigateur';
    clearTimeout(syncT); syncT = setTimeout(refreshAll, 150);
  });
  XL.sync.init();

  /* ---------- Démarrage ---------- */
  applyPrefs();
  if (player) setPlayer(player);
  const hash = decodeURIComponent(location.hash.slice(1));
  let start = 0;
  if (hash.startsWith('import=')) {
    const code = hash.slice(7); history.replaceState(null, '', location.pathname + location.search);
    setTimeout(() => {
      try {
        const list = XL.share.decode(code); const who = [...new Set(list.map((r) => r.p))].join(', ');
        dialog('Résultats reçus 📨', h('p', null, `Ce lien contient ${list.length} résultat(s) de ${who || 'quelqu\'un'}. Les ajouter à ton classeur ?`), [{ label: 'Plus tard' }, { label: 'Importer', primary: true, onClick: () => doImport(code) }]);
      } catch (e) { toast('⚠ Lien de partage invalide'); }
    }, player ? 400 : 1200);
  } else {
    const i = SHEETS.findIndex((s) => s.id === hash); if (i >= 0) start = i;
  }
  go(start, { force: true });
  if (!player) { setPlayer('Lucas'); setTimeout(() => toast('👤 Tu joues en tant que Lucas. Pas toi ? Clique sur le nom en haut à droite.', 5000), 600); }
  setTimeout(() => toast('Astuce : Alt + Page suiv. pour changer de feuille, comme dans un vrai tableur.'), 1800);
  window.__detente = { go, cmd, sessions, SHEETS, snake };
})();

</script>
</body>
</html>
